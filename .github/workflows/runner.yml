# Upstream Godot fires this on every push. the-battle-dogs compiles the editor
# from its own Actions (godot-doggo-bin), so this runner is dispatch-only.
name: 🔗 GHA
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # the-battle-dogs only ships a Windows MSVC editor. Android / iOS / Linux /
  # macOS / Web / static-checks stay in the tree but are not called from here.
  windows-build:
    name: 🏁 Windows
    if: ${{ !vars.DISABLE_GODOT_CI || github.run_attempt > 1 || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/windows_builds.yml
